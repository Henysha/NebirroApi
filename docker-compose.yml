services:
  postgres:
    image: postgres:16-alpine
    container_name: nebirro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nebirro
      POSTGRES_PASSWORD: nebirro
      POSTGRES_DB: nebirro
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nebirro -d nebirro"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nebirro-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://nebirro:nebirro@postgres:5432/nebirro?schema=public
      API_KEY_PEPPER: local-development-pepper
      MERCHANT_OPERATOR_KEY: ${MERCHANT_OPERATOR_KEY:-}
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run docker:start:dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nebirro-frontend
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:3000/api
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres-data:
