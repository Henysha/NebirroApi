name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nebirro
          POSTGRES_PASSWORD: nebirro
          POSTGRES_DB: nebirro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nebirro -d nebirro"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://nebirro:nebirro@localhost:5432/nebirro?schema=public
      API_KEY_PEPPER: integration-test-pepper
      NODE_ENV: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w backend

      - name: Build SDK
        run: npm run build -w sdk

      - name: Build backend
        run: npm run build -w backend

      - name: Build frontend
        run: npm run build -w frontend

      - name: Run backend unit tests
        run: npm run test -w backend

      - name: Run backend integration tests
        run: npm run test:integration -w backend
